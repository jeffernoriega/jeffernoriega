<style>
text{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;} .t{fill:#1F2330} .m{fill:#6B7280} .track{fill:#EEF0F5}
@media (prefers-color-scheme: dark){.t{fill:#E8EAF2} .m{fill:#9AA3B5} .track{fill:#21262D}}
.bar{transform-origin:20px 0;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) .2s backwards}
